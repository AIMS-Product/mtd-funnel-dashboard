<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow">
<title>Month over Month — V2 Funnel Performance</title><style>__STYLE__
.month-toggles{padding:24px 36px;display:flex;gap:14px;flex-wrap:wrap}.month-toggles label{display:flex;gap:6px;align-items:center}.comparison-note{padding:10px 36px 24px;color:var(--muted2)}.header a{color:var(--accent)}
</style></head><body>
<div class="header"><div class="header-left"><h1>Month over Month <span class="shadow-tag">V2</span></h1><p class="sub">Funnel performance using V2 booking and attribution rules · October 2026 onward</p></div><a href="../index.html">← Back to V2</a></div>
<div class="month-toggles" id="months"></div>
<p class="comparison-note" id="note"></p><div class="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div>
<script id="comparison-data" type="application/json">__MONTHS__</script>
<script>
const months=JSON.parse(document.getElementById('comparison-data').textContent);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('en-US').format(n||0);
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n||0);
const pct=(n,d)=>d?`${(100*n/d).toFixed(1)}%`:'—';
document.getElementById('months').innerHTML=months.map(m=>`<label><input type="checkbox" value="${esc(m.view.key)}" checked>${esc(m.view.label)}${m.view.frozen?'':' · MTD'}</label>`).join('');
document.getElementById('note').textContent=months.length===1?'October is the first V2 month. Future months will appear here automatically.':'Select months to compare. The current month shows month-to-date results; archived months show completed periods.';
function render(){
 const selected=new Set([...document.querySelectorAll('#months input:checked')].map(input=>input.value));
 const active=months.filter(m=>selected.has(m.view.key));
 document.getElementById('head').innerHTML=`<tr><th rowspan="2" class="col-name">Funnel</th>${active.map(m=>`<th colspan="5">${esc(m.view.label)}${m.view.frozen?'':' · MTD'}</th>`).join('')}</tr><tr>${active.map(()=>'<th>Booked</th><th>Show %</th><th>Qual %</th><th>CW %</th><th>Revenue</th>').join('')}</tr>`;
 const names=[...new Set(active.flatMap(m=>m.channels.map(c=>c.channel)))].sort();
 document.getElementById('rows').innerHTML=[...names,'TOTAL'].map(name=>`<tr class="${name==='TOTAL'?'total-row':'funnel-row'}"><td class="col-name">${esc(name)}</td>${active.map(m=>{const c=name==='TOTAL'?m.totals:m.channels.find(c=>c.channel===name)||{};return `<td class="col-num">${fmt(c.bookings)}</td><td class="col-pct">${c.formats?.show||'—'}</td><td class="col-pct">${c.formats?.qualified||'—'}</td><td class="col-pct">${c.formats?.close||'—'}</td><td class="col-rev">${c.formats?.revenue||'$0'}</td>`;}).join('')}</tr>`).join('');
}
document.querySelectorAll('#months input').forEach(input=>input.addEventListener('change',render));render();
</script></body></html>
