name: Update MTD Funnel V2 Dashboard

# Dispatched by cron-job.org every 15 minutes, matching the current MTD cadence.
on:
  workflow_dispatch:

concurrency:
  group: mtd-funnel-v2-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Build fresh V2 snapshot
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
        run: python3 -u v2/build.py

      - name: Render aggregate-only V2 page
        run: python3 -u v2/publish_shadow.py

      - name: Commit and push only the public V2 page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- v2/index.html
          if git diff --cached --quiet; then
            echo "V2 page is already current."
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "v2/index.html"
          git commit -m "Update MTD V2 dashboard [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          # Other dashboard jobs can update main while the V2 build is running.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo "Could not push V2 after five attempts." >&2
          exit 1
