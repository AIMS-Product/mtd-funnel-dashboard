name: Generate V2 Weekly and Team Reports

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Report start date (YYYY-MM-DD), October 2026 onward"
        required: true
        type: string
      end_date:
        description: "Report end date (YYYY-MM-DD), inclusive"
        required: true
        type: string

concurrency:
  group: mtd-funnel-v2-custom-reports
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check V2 reporting behavior
        run: python3 -m unittest discover -s v2 -p 'test*.py' -q
      - name: Generate both reports with V2 rules
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
          START: ${{ inputs.start_date }}
          END: ${{ inputs.end_date }}
        run: python3 -u v2/reports.py --start "$START" --end "$END"
      - name: Publish V2 aggregate CSVs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- v2/reports/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate V2 funnel and team reports"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
